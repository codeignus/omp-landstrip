name: CI

on:
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      - run: npm run ci:fmt
      - run: npm run ci:lint
      - run: npm run ci:check
      - run: npm run ci:test
